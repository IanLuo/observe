<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="observe-token" content="{{TOKEN}}">
<title>Observe</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23315FC5'/%3E%3Ccircle cx='8' cy='8' r='3' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header id="header"></header>
<div id="banner" class="banner" role="status" aria-live="polite" hidden></div>

<main>
  <aside class="left" aria-label="Goals and diff">
    <p id="baseline" class="baseline"></p>
    <nav id="rail" class="rail" aria-label="Locked goals"></nav>
    <section id="diff" class="diff" aria-label="Selected diff"></section>
    <section id="conflicts" class="conflicts" aria-label="Prompt conflicts"></section>
  </aside>

  <section class="center" aria-label="Project map">
    <div id="map" class="map-wrap"></div>
  </section>

  <aside id="detail" class="detail" aria-label="Detail" aria-live="polite"></aside>
</main>

<footer id="footer"></footer>
<script src="/app.js"></script>
</body>
</html>
